# Pre-commit hooks: format + lint before each commit.
# Install once per clone: `pip install pre-commit && pre-commit install`
# Run manually across all files: `pre-commit run --all-files`

repos:
  # Ruff (backend Python lint + format).
  # Keep this in sync with backend/requirements-dev.txt so pre-commit and CI
  # run the identical version — otherwise they can disagree on which rules
  # fire and what `ruff format` produces.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Prettier (frontend formatter).
  # Pin to the v3 line to match frontend/package.json ("prettier": "^3.3.3").
  # v4 is still pre-release and reformats differently — keep them aligned.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^frontend/
        # Don't fight on auto-generated / vendored files.
        exclude: ^frontend/(node_modules|dist|build)/

  # Generic safety net
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
