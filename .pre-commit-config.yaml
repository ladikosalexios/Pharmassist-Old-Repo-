# Pre-commit hooks: format + lint before each commit.
# Install once per clone: `pip install pre-commit && pre-commit install`
# Run manually across all files: `pre-commit run --all-files`

repos:
  # Ruff (backend Python lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Prettier (frontend formatter)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
        # Don't fight on auto-generated / vendored files.
        exclude: ^frontend/(node_modules|dist|build)/

  # Generic safety net
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
