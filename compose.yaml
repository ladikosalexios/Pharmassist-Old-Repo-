services:
  frontend:
    image: pharmassist/frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
    # don't copy the node_modules to prevent the volume hosted on windows from overwriting the linux packages on the container
      - ./frontend/src:/usr/src/app/src
    depends_on:
      - backend
  backend:
    image: pharmassist/backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/usr/src/app
    environment:
      # Override config.py default — `localhost` would mean the backend
      # container itself; we want the `db` service on the compose network.
      DATABASE_URL: postgresql+asyncpg://pharmassist:pharmassist_dev@db:5432/pharmassist
      PHARMAPI_MOCK: "true"
      # HMVS stays mocked in dev — canned ITE-style pack responses, no OAuth2
      # token fetch. The client secret is NEVER inlined here (unlike PHARMAPI_*);
      # live ITE runs set HMVS_MOCK=false + HMVS_CLIENT_ID/SECRET via env/SSM.
      HMVS_MOCK: "true"
      # Tells the production guard in main.py not to fire when COOKIE_SECURE=false.
      # Production deployments must NOT set this (missing ENV defaults to "production").
      ENV: development
      # Required secrets — config.py has no in-code fallback, so the local
      # dev stack supplies them here. Dev/test values only; production must
      # provide real ones through its own environment.
      SECRET_KEY: dev-secret-key-not-for-production
      PHARMAPI_USERNAME: medcare1pharmapi
      PHARMAPI_PASSWORD: "Scorebook5-Encounter8-Catfight8-Opposing6"
      PHARMAPI_API_KEY: pi2jwygkd07yho3a4dw6jc55tg5ra3uc
      # Keep the ΗΔΥΚΑ session warm so it never lapses (>=1 /user/me per 24h).
      PHARMAPI_KEEPALIVE_ENABLED: "true"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmassist
      POSTGRES_USER: pharmassist
      POSTGRES_PASSWORD: pharmassist_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    profiles:
      - tools

volumes:
  pgdata:
