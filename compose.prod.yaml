# Production-flavour stack for the internal mock pilot.
#
# Boot it with an env file that holds the required secrets (see
# .env.prod.example):
#
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# How this differs from compose.yaml (dev):
#   • No source bind mounts — code is baked into the images; nothing is mounted
#     from the host, so what you test is what ships.
#   • Secrets are env-driven (${VAR:?...}); compose refuses to start if unset.
#   • ENV=production → main.py's guard enforces COOKIE_SECURE=true.
#   • PHARMAPI_MOCK=true → the app serves mock upstream data at runtime (no live
#     ΗΔΥΚΑ calls). NOTE: scripts/seed still authenticates against live Pharmapi
#     to materialise the pharmacy/pharmacist — see docs/pilot-runbook.md.
#   • The Postgres port is NOT published; only Caddy (80/443) faces the host.
name: pharmassist-pilot

# Cap container log growth so a long-running single-box pilot can't fill the
# host disk with the default unbounded json-file driver.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Caddy: serves the compiled SPA and reverse-proxies the API to backend:8000.
  frontend:
    image: pharmassist/frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Public hostname → automatic HTTPS (Let's Encrypt over ACME). Use your
      # own domain, or a free `<public-ip>.sslip.io` name (no domain purchase —
      # sslip.io resolves the embedded IP publicly, so Caddy can issue a real
      # cert). Leave as localhost only for a local-cert smoke test. See the
      # Caddyfile / docs/aws-public-deploy.md.
      PILOT_DOMAIN: ${PILOT_DOMAIN:-localhost}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Persist issued certs + ACME account across restarts. Without this Caddy
      # re-requests on every boot and can hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

  backend:
    image: pharmassist/backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Host port intentionally NOT published — Caddy reaches it as backend:8000
    # over the compose network. `expose` documents the port without binding it
    # to the host (which would bypass TLS + the cookie-secure boundary).
    logging: *default-logging
    networks:
      # Bridges the web tier (Caddy) and the data tier (db). Only this service
      # sits on both, so Caddy has no route to Postgres.
      - web
      - data
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmassist:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/pharmassist
      # Production guard (main.py): ENV=production REQUIRES COOKIE_SECURE=true.
      ENV: production
      COOKIE_SECURE: "true"
      # Mock pilot: serve synthetic upstream data at runtime.
      PHARMAPI_MOCK: "true"
      # HMVS (EU-FMD) integration. HMVS_MOCK=false flips dispense to the live
      # ITE sandbox — opt-in per deploy so a forgotten env doesn't silently 503
      # every supply. The two URLs default to the ITE sandbox; the two secrets
      # use the ${VAR:?msg} required-var pattern so a live flip without creds
      # fails at compose-up rather than at first dispense.
      HMVS_MOCK: ${HMVS_MOCK:-true}
      HMVS_IDENTITY_URL: ${HMVS_IDENTITY_URL:-https://api-gr-iqe.nmvo.eu}
      HMVS_VERIFICATION_URL: ${HMVS_VERIFICATION_URL:-https://api-gr-iqe.nmvo.eu/verification}
      HMVS_CLIENT_ID: ${HMVS_CLIENT_ID:?set HMVS_CLIENT_ID}
      HMVS_CLIENT_SECRET: ${HMVS_CLIENT_SECRET:?set HMVS_CLIENT_SECRET}
      # Pin CORS to the pilot origin. The SPA is same-origin via Caddy, so this
      # is defence-in-depth — but config.py defaults to "*", which with
      # credentials=True is a spec-invalid no-op. Follows PILOT_DOMAIN; for a
      # different/extra origin, set CORS_ALLOW_ORIGINS (comma-separated) yourself.
      CORS_ALLOW_ORIGINS: "https://${PILOT_DOMAIN:-localhost}"
      # ── Required secrets — no in-code fallback; compose fails fast if unset ──
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      PHARMAPI_USERNAME: ${PHARMAPI_USERNAME:?set PHARMAPI_USERNAME}
      PHARMAPI_PASSWORD: ${PHARMAPI_PASSWORD:?set PHARMAPI_PASSWORD}
      PHARMAPI_API_KEY: ${PHARMAPI_API_KEY:?set PHARMAPI_API_KEY}
      # Keep the ΗΔΥΚΑ session warm so it never lapses (>=1 /user/me per 24h).
      PHARMAPI_KEEPALIVE_ENABLED: ${PHARMAPI_KEEPALIVE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      # Data tier only — not reachable from Caddy.
      - data
    environment:
      POSTGRES_DB: pharmassist
      POSTGRES_USER: pharmassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Port intentionally NOT published — the DB is reachable only on the compose
    # network. Use the runbook's `compose exec db …` recipes for dumps/restores.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmassist -d pharmassist"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Postgres initialises its data dir on first boot; don't count those
      # seconds as failures.
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Two tiers so the database has no L2 path to the internet-facing proxy.
  web:
  data:
