name: Verify

on:
  pull_request:
    # The harness is stacked on the existing instructions PR until it lands.
    branches: [main, fix/track-claude-md]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

# Every job runs verify.py inside the dev container's `tools` stage (.devcontainer/Dockerfile),
# so CI and the container share one definition of the Python, Node and PostgreSQL versions.
# The image is built in each job from the GitHub Actions cache; a PR that edits the
# Dockerfile is verified against its own image.
jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend (ruff)
            deps: backend
            lockfile: backend/requirements-dev.lock
            run: python3 scripts/verify.py --backend-only --quick
          - name: backend (pytest, DB-less subset)
            deps: backend
            lockfile: backend/requirements-dev.lock
            run: python3 scripts/verify.py --backend-only
          # The eight database suites (the Yellow Card suite last, failing on any skip) and
          # the real-psql harness regression, in a disposable socket-only cluster created by
          # verify.py from the image's PostgreSQL 16 (Compose's major version); never a
          # shared database. The version check fails loudly if the image stops shipping 16.
          - name: backend (database suites, isolated PostgreSQL 16)
            deps: backend
            lockfile: backend/requirements-dev.lock
            run: >-
              /usr/lib/postgresql/16/bin/postgres --version | grep -E ' 16\.' &&
              python3 scripts/verify.py --backend-only --with-db --pg-bin /usr/lib/postgresql/16/bin
          - name: frontend (eslint + prettier)
            deps: frontend
            lockfile: frontend/package-lock.json
            run: python3 scripts/verify.py --frontend-only
    steps:
      - uses: actions/checkout@v4
      # The image's user takes the runner's uid so it can write to the mounted checkout.
      - id: runner
        run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          target: tools
          build-args: DEV_UID=${{ steps.runner.outputs.uid }}
          tags: pharmassist-tools:ci
          load: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cache
          key: tools-node26-py313-${{ runner.os }}-${{ runner.arch }}-${{ matrix.deps }}-${{ hashFiles(matrix.lockfile) }}
      - name: Install dependencies and verify
        env:
          DEPS: ${{ matrix.deps }}
          RUN: ${{ matrix.run }}
        run: |
          # Created here, not by Docker, so the mount belongs to the runner's uid.
          mkdir -p "$RUNNER_TEMP/cache"
          if [ "$DEPS" = backend ]; then
            install='python3.13 -m venv backend/.venv && backend/.venv/bin/python -m pip install -r backend/requirements-dev.lock'
          else
            install='(cd frontend && npm ci)'
          fi
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$RUNNER_TEMP/cache:/home/dev/.cache" \
            -e npm_config_cache=/home/dev/.cache/npm \
            pharmassist-tools:ci \
            bash -euo pipefail -c "$install && $RUN"
