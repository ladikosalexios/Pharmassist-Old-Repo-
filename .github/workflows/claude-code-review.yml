name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Claude Code Review
        id: claude-review
        # Drafts still get explicit evidence, without launching the paid action.
        if: ${{ github.event.pull_request.draft == false }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow runs triggered by claude[bot]'s own commits (from @claude
          # fix flows) and github-actions[bot]. Without this the action
          # refuses to run on bot-authored pushes — which is what blocked
          # the auto-review on PR #67 after claude[bot] pushed a fix.
          allowed_bots: 'claude[bot],github-actions[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Run /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            without --comment. Preserve the plugin's eligibility rules. Do not post any
            GitHub comments, reviews, or other writes. Expected head is
            ${{ github.event.pull_request.head.sha }} and base is ${{ github.event.pull_request.base.sha }}.
            Check the PR head and base before and after reviewing. If either differs from
            these expected revisions, report skipped with reason revision_changed.
            After the command finishes, return the structured attestation: completed only
            if the review actually ran for these revisions, with reason reviewed and the
            findings count. Otherwise report skipped with its reason and null reviewed
            SHAs/findings count. A plugin skip or action success is not a completed review.
          claude_args: >-
            --json-schema '{"type":"object","additionalProperties":false,"required":["outcome","reason","reviewed_head_sha","reviewed_base_sha","findings_count"],"properties":{"outcome":{"type":"string","enum":["completed","skipped"]},"reason":{"type":"string","enum":["reviewed","closed","draft","not_needed","prior_review","revision_changed","other"]},"reviewed_head_sha":{"type":["string","null"],"pattern":"^[0-9a-f]{40}$"},"reviewed_base_sha":{"type":["string","null"],"pattern":"^[0-9a-f]{40}$"},"findings_count":{"type":["integer","null"],"minimum":0}}}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Record review evidence
        if: always()
        env:
          REVIEW_ACTION_OUTCOME: ${{ steps.claude-review.outcome }}
          REVIEW_REPORT: ${{ steps.claude-review.outputs.structured_output }}
        run: python3 scripts/review_evidence.py

      # The action hides Claude's output, so an is_error:true failure is
      # undiagnosable from the job log alone (e.g. expired OAuth token vs.
      # usage-limit exhaustion vs. upstream error). Surface just the error
      # text from the execution log on failure.
      - name: Print Claude error on failure
        if: failure()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$f" ]; then
            echo "── result / error fields from claude-execution-output.json ──"
            jq -r '.[] | select(.type=="result") | {subtype, is_error, result, errors} | @json' "$f" || cat "$f" | tail -5
          else
            echo "no claude-execution-output.json found"
          fi
