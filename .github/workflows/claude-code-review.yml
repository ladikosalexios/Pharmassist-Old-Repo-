name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Draft verification must not launch a paid agent review.
    if: ${{ github.event.pull_request.draft == false }}
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow runs triggered by claude[bot]'s own commits (from @claude
          # fix flows) and github-actions[bot]. Without this the action
          # refuses to run on bot-authored pushes — which is what blocked
          # the auto-review on PR #67 after claude[bot] pushed a fix.
          allowed_bots: 'claude[bot],github-actions[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output, so an is_error:true failure is
      # undiagnosable from the job log alone (e.g. expired OAuth token vs.
      # usage-limit exhaustion vs. upstream error). Surface just the error
      # text from the execution log on failure.
      - name: Print Claude error on failure
        if: failure()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$f" ]; then
            echo "── result / error fields from claude-execution-output.json ──"
            jq -r '.[] | select(.type=="result") | {subtype, is_error, result, errors} | @json' "$f" || cat "$f" | tail -5
          else
            echo "no claude-execution-output.json found"
          fi
