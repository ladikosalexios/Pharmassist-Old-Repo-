[tool.pytest.ini_options]
# Tests run from the backend/ directory; add it to sys.path so `from main import app` works.
# importlib mode keeps pytest from prepending stray ancestors (and thus avoids
# `/` leaking into sys.path and a namespace `app` collision with the cwd).
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]  # auto-generated migrations — don't fight them

[tool.ruff.lint]
# Conservative starter set. Expand once we're comfortable.
#   E/W = pycodestyle errors + warnings (includes E501 line-too-long)
#   F   = pyflakes (real bugs: undefined names, unused imports, etc)
#   I   = isort  (consistent import order)
#   B   = bugbear (subtle correctness bugs like mutable default args)
#   UP  = pyupgrade (use modern Python idioms — we target 3.13)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports legitimately appear "unused"
"__init__.py" = ["F401"]
# SQLAlchemy models use forward-ref strings (Mapped["OtherModel"]) — not real undefined names.
# Module-level docstrings/comments are also long-form (medical context) — don't wrap them.
"app/db/models/*.py" = ["F821", "E501"]
# Mock-data fixtures and clinical strings (SPC text, ADR messages, safety-check descriptions,
# patient-facing alerts) read worse when wrapped — keep them on one line. Routers/services
# that embed long upstream URLs or clinical narrative also opt out.
"app/services/alerts.py" = ["E501"]
"app/services/instructions.py" = ["E501"]
"app/services/llm.py" = ["E501"]
"app/services/messages.py" = ["E501"]
"app/services/pharmapi.py" = ["E501"]
"app/services/prescriptions.py" = ["E501"]
"app/services/safety_checks.py" = ["E501"]
"app/services/spc.py" = ["E501"]
"app/services/spc_parse.py" = ["E501"]
"app/services/spc_extract.py" = ["E501"]
"app/services/spc_sources/*.py" = ["E501"]
"tests/test_spc_*.py" = ["E501"]
"app/routers/documentation.py" = ["E501"]
"app/routers/instructions.py" = ["E501"]
"app/routers/side_effects.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these in default args by convention; ruff B008 would otherwise flag them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Security",
    # Our own dependency factory (T2-1): Tier-2 routes gate inline via
    # `Depends(require_tier("clinical"))` — the same FastAPI default-arg idiom.
    # ruff resolves by fully-qualified path; suppress per-site with # noqa: B008.
    "app.routers.v1.deps.require_tier",
]

[tool.ruff.format]
# Single-quote vs double-quote: we don't care strongly, default is double.
# preserve = leave existing quote style; "double" = enforce double.
quote-style = "double"
