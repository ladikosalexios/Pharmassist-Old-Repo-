# HMVO IQE testbook run overlay — flips the dispense flow to the LIVE Greek IQE
# sandbox while keeping prescriptions / ΗΔΥΚΑ mocked (PHARMAPI_MOCK stays true
# from compose.yaml). Use for the qualification run:
#
#   docker compose -f compose.yaml -f compose.iqe.yaml up -d backend
#
# Revert to mock with a normal:  docker compose up -d backend
#
# Credentials come from backend/.env (gitignored: HMVS_CLIENT_ID /
# HMVS_CLIENT_SECRET) — NEVER inline the secret here. The HMVS_MOCK + IQE URLs
# below override compose.yaml; the env_file supplies only the two creds (every
# other value still comes from compose.yaml's environment block, which outranks
# env_file — so PHARMAPI stays mocked).
services:
  backend:
    env_file:
      - backend/.env
    environment:
      HMVS_MOCK: "false"
      HMVS_IDENTITY_URL: https://api-gr-iqe.nmvo.eu
      HMVS_VERIFICATION_URL: https://api-gr-iqe.nmvo.eu/verification
