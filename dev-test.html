<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmAssist — Dev API Console</title>
<style>
  :root {
    --bg:        #0A0F1E;
    --bg-2:      #0E1530;
    --panel:     #121a36;
    --panel-2:   #18224a;
    --border:    #243162;
    --border-2:  #2f3f7e;
    --text:      #e6ecff;
    --muted:     #8a98c4;
    --muted-2:   #5a6896;
    --accent:    #00D4FF;
    --accent-2:  #6df0ff;
    --get:       #3aa1ff;
    --post:      #22c55e;
    --patch:     #f59e0b;
    --delete:    #ef4444;
    --ok:        #22c55e;
    --warn:      #f59e0b;
    --err:       #ef4444;
    --shadow:    0 6px 24px rgba(0, 0, 0, 0.45);
    --mono:      ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --sans:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }

  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
  }
  textarea { font-family: var(--mono); resize: vertical; min-height: 120px; }

  /* Layout */
  .app {
    display: grid;
    grid-template-rows: 56px 1fr auto;
    height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: linear-gradient(180deg, #0c1330 0%, #0a0f1e 100%);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-weight: 600; letter-spacing: 0.3px;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.55);
  }
  .brand-name { color: var(--text); }
  .brand-tag  { color: var(--muted); font-weight: 400; font-size: 12px; }

  .header-spacer { flex: 1; }

  .hdr-block { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .hdr-block label { color: var(--muted-2); }
  .hdr-block input { width: 230px; padding: 5px 9px; font-size: 12px; }
  .jwt-pill {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .jwt-pill.has-token { color: var(--accent); border-color: var(--accent); }

  .session-dot {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #475569; transition: background .2s;
  }
  .dot.ok      { background: var(--ok);   box-shadow: 0 0 8px var(--ok); }
  .dot.warn    { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.err     { background: var(--err);  box-shadow: 0 0 8px var(--err); }

  .btn {
    background: linear-gradient(180deg, #1c2752 0%, #131c40 100%);
    border: 1px solid var(--border-2);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 13px;
    cursor: pointer;
    font-size: 13px;
    transition: border-color .15s, transform .05s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(180deg, #00b9e0 0%, #0091b3 100%);
    border-color: #00d4ff;
    color: #06121f;
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  /* Body grid */
  .body {
    display: grid;
    grid-template-columns: 290px 1fr;
    min-height: 0;
  }

  /* Sidebar */
  .sidebar {
    background: #08101e;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 0 24px;
  }
  .sidebar-search {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: #08101e;
    position: sticky; top: 0; z-index: 1;
  }
  .group-title {
    color: var(--muted-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    padding: 14px 14px 6px;
    font-weight: 600;
  }
  .ep-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    font-size: 12.5px;
    color: var(--text);
  }
  .ep-item:hover { background: rgba(0, 212, 255, 0.05); }
  .ep-item.active {
    background: rgba(0, 212, 255, 0.1);
    border-left-color: var(--accent);
  }
  .method-badge {
    display: inline-block;
    min-width: 52px;
    text-align: center;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #06121f;
    flex-shrink: 0;
  }
  .method-GET    { background: var(--get); }
  .method-POST   { background: var(--post); }
  .method-PATCH  { background: var(--patch); }
  .method-DELETE { background: var(--delete); color: #fff; }
  .ep-path {
    font-family: var(--mono);
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Main */
  .main {
    overflow-y: auto;
    padding: 22px 26px 12px;
  }
  .main-empty {
    color: var(--muted);
    margin-top: 80px;
    text-align: center;
  }

  .ep-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 6px;
  }
  .ep-header .method-badge { font-size: 12px; padding: 4px 10px; min-width: 64px; }
  .ep-header .path {
    font-family: var(--mono);
    font-size: 17px;
    color: var(--text);
    font-weight: 500;
  }
  .ep-meta {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 14px;
  }
  .ep-auth-tag {
    display: inline-block;
    margin-left: 10px;
    background: rgba(245, 158, 11, 0.12);
    color: var(--patch);
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    vertical-align: middle;
  }
  .ep-auth-tag.public {
    background: rgba(34, 197, 94, 0.12);
    color: var(--ok);
    border-color: rgba(34, 197, 94, 0.4);
  }

  .form-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .field-section {
    margin-bottom: 14px;
  }
  .field-section:last-child { margin-bottom: 0; }
  .field-section h4 {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
  }
  .field-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  .field-row label {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }
  .field-hint { color: var(--muted-2); font-size: 11px; margin-left: 4px; }

  .form-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  /* Response */
  .response {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .response-head {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #06121f;
  }
  .status-2xx { background: var(--ok); }
  .status-3xx { background: var(--accent); }
  .status-4xx { background: var(--warn); }
  .status-5xx { background: var(--err); color: #fff; }
  .status-net { background: #475569; color: #fff; }
  .latency { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .response-actions { margin-left: auto; }

  .response-body {
    padding: 12px 14px;
    background: #07101e;
    max-height: 460px;
    overflow: auto;
  }
  .response-body pre {
    margin: 0;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* JSON syntax highlight */
  .j-key   { color: #6df0ff; }
  .j-str   { color: #a7f3a7; }
  .j-num   { color: #f5b88a; }
  .j-bool  { color: #ffaad4; }
  .j-null  { color: #b6b6c8; }

  .callout {
    margin: 10px 14px 0;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-left: 3px solid var(--warn);
    border-radius: 6px;
    padding: 10px 12px;
    color: #fde2a4;
    font-size: 12.5px;
  }
  .callout strong { color: #ffd980; }

  /* History */
  .history {
    border-top: 1px solid var(--border);
    background: #08101e;
    flex-shrink: 0;
  }
  .history-head {
    padding: 8px 18px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    user-select: none;
  }
  .history-head:hover { background: rgba(255,255,255,0.02); }
  .history-title {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-weight: 600;
  }
  .history-count {
    color: var(--muted-2);
    font-size: 12px;
  }
  .chev {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
    transition: transform .2s;
  }
  .history.collapsed .chev { transform: rotate(-90deg); }
  .history-list {
    max-height: 220px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .history.collapsed .history-list { display: none; }
  .history-item {
    display: grid;
    grid-template-columns: 60px 1fr 70px 110px 28px;
    gap: 10px;
    align-items: center;
    padding: 5px 18px;
    font-family: var(--mono);
    font-size: 12px;
    border-bottom: 1px solid rgba(36, 49, 98, 0.4);
    color: var(--text);
    cursor: pointer;
  }
  .history-item:hover { background: rgba(0, 212, 255, 0.05); }
  .history-item .h-status {
    text-align: right;
    font-weight: 700;
  }
  .h-2xx { color: var(--ok); }
  .h-3xx { color: var(--accent); }
  .h-4xx { color: var(--warn); }
  .h-5xx { color: var(--err); }
  .h-net { color: #94a3b8; }
  .h-time { color: var(--muted); text-align: right; font-size: 11px; }

  /* Misc */
  .toast {
    position: fixed;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    box-shadow: var(--shadow);
    z-index: 100;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1f2950; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3a73; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">PharmAssist</span>
      <span class="brand-tag">· dev API console</span>
    </div>
    <div class="header-spacer"></div>

    <div class="hdr-block">
      <label>Base URL</label>
      <input id="base-url" type="text" value="http://localhost:8000" spellcheck="false">
    </div>

    <div class="hdr-block">
      <span class="jwt-pill" id="jwt-pill" title="Click to copy">JWT: (none)</span>
    </div>

    <div class="hdr-block">
      <span class="session-dot" id="session-dot" title="Pharmapi session">
        <span class="dot" id="session-dot-light"></span>
        <span id="session-dot-label">Pharmapi: ?</span>
      </span>
    </div>

    <button class="btn primary" id="quick-setup">Quick setup</button>
    <button class="btn ghost" id="logout-btn" title="Clear stored token">Reset</button>
  </div>

  <!-- Body -->
  <div class="body">
    <div class="sidebar">
      <div class="sidebar-search">
        <input id="ep-search" type="search" placeholder="Filter endpoints…" spellcheck="false">
      </div>
      <div id="sidebar-list"></div>
    </div>
    <div class="main" id="main"></div>
  </div>

  <!-- History -->
  <div class="history" id="history">
    <div class="history-head" id="history-toggle">
      <span class="history-title">History</span>
      <span class="history-count" id="history-count">0</span>
      <span class="chev">▾</span>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Endpoint catalogue — derived from backend/app/routers/*.py
   ============================================================ */
const ENDPOINTS = [
  // health
  { id: 'health', group: 'health', method: 'GET', path: '/health', auth: false,
    desc: 'Public health probe — no auth required.' },

  // auth
  { id: 'auth-login', group: 'auth', method: 'POST', path: '/auth/login', auth: false,
    desc: 'OAuth2 password login. Returns JWT for all subsequent calls.',
    contentType: 'form',
    formFields: [
      { name: 'username', default: 'pharmacist@demo.gr', type: 'text' },
      { name: 'password', default: 'demo123',            type: 'password' },
    ] },
  { id: 'auth-me', group: 'auth', method: 'GET', path: '/auth/me', auth: true,
    desc: 'Current pharmacist identity.' },

  // pharmapi
  { id: 'pharmapi-connect', group: 'pharmapi', method: 'POST', path: '/pharmapi/connect', auth: true,
    desc: 'Establish (or refresh) the 24h Pharmapi (ΗΔΥΚΑ) session.' },
  { id: 'pharmapi-status', group: 'pharmapi', method: 'GET', path: '/pharmapi/status', auth: true,
    desc: 'Show current Pharmapi session state.' },
  { id: 'pharmapi-pharmacy', group: 'pharmapi', method: 'GET', path: '/pharmapi/pharmacy', auth: true,
    desc: 'Fetch pharmacy details from Pharmapi.' },
  { id: 'pharmapi-rx-by-barcode', group: 'pharmapi', method: 'GET', path: '/pharmapi/prescriptions/{barcode}', auth: true,
    desc: 'Load a prescription by barcode from Pharmapi.',
    pathParams: [{ name: 'barcode', default: '12345678' }] },

  // prescriptions
  { id: 'rx-next', group: 'prescriptions', method: 'GET', path: '/prescriptions/next', auth: true,
    desc: 'Next PENDING prescription in the queue.' },
  { id: 'rx-list', group: 'prescriptions', method: 'GET', path: '/prescriptions', auth: true,
    desc: 'Prescription queue for the dashboard.' },
  { id: 'rx-get', group: 'prescriptions', method: 'GET', path: '/prescriptions/{rx_id}', auth: true,
    desc: 'Prescription detail (patient, medication, prescriber, safety checks).',
    pathParams: [{ name: 'rx_id', default: 'RX2024-001' }] },
  { id: 'rx-approve', group: 'prescriptions', method: 'POST', path: '/prescriptions/{rx_id}/approve', auth: true,
    desc: 'Mark prescription COMPLETED.',
    pathParams: [{ name: 'rx_id', default: 'RX2024-001' }] },
  { id: 'rx-patch', group: 'prescriptions', method: 'PATCH', path: '/prescriptions/{rx_id}', auth: true,
    desc: 'Partial update — used by the Flag Discrepancy modal.',
    pathParams: [{ name: 'rx_id', default: 'RX2024-001' }],
    body: {
      status: 'FLAGGED',
      discrepancy_type: 'DOSAGE',
      notes: 'Dose seems unusually high for this patient.',
      notify_physician: true
    } },

  // safety-checks
  { id: 'safety-checks-get', group: 'safety-checks', method: 'GET', path: '/safety-checks/{rx_id}', auth: true,
    desc: 'Automated safety checks for a prescription.',
    pathParams: [{ name: 'rx_id', default: 'RX2024-001' }] },

  // spc
  { id: 'spc-get', group: 'spc', method: 'GET', path: '/spc/{atc_code}', auth: true,
    desc: 'Summary of Product Characteristics by ATC code.',
    pathParams: [{ name: 'atc_code', default: 'C09AA05' }] },

  // alerts
  { id: 'alerts-active', group: 'alerts', method: 'GET', path: '/alerts/active', auth: true,
    desc: 'Active safety alerts for the dashboard.' },

  // messages
  { id: 'messages-list', group: 'messages', method: 'GET', path: '/messages', auth: true,
    desc: 'Thread between pharmacist and prescriber for a given rxId.',
    queryParams: [{ name: 'rxId', default: 'RX2024-001' }] },
  { id: 'messages-post', group: 'messages', method: 'POST', path: '/messages', auth: true,
    desc: 'Send a message in the thread.',
    body: {
      to: 'prescriber',
      rxId: 'RX2024-001',
      body: 'Hi doctor, can you confirm the dose on RX2024-001?'
    } },

  // documentation
  { id: 'doc-list', group: 'documentation', method: 'GET', path: '/documentation', auth: true,
    desc: 'List documentation log (paginated).',
    queryParams: [
      { name: 'q',      default: '' },
      { name: 'method', default: '' },
      { name: 'limit',  default: '50' },
      { name: 'offset', default: '0' },
    ] },
  { id: 'doc-export-all', group: 'documentation', method: 'GET', path: '/documentation/export', auth: true,
    desc: 'Export full log (PDF or CSV). Returns a file — JSON view will show raw text.',
    queryParams: [
      { name: 'q',      default: '' },
      { name: 'method', default: '' },
      { name: 'format', default: 'csv' },
    ] },
  { id: 'doc-get', group: 'documentation', method: 'GET', path: '/documentation/{doc_id}', auth: true,
    desc: 'Single documentation record.',
    pathParams: [{ name: 'doc_id', default: 'DOC-001' }] },
  { id: 'doc-export-record', group: 'documentation', method: 'GET', path: '/documentation/{doc_id}/export', auth: true,
    desc: 'Export single record (PDF or CSV).',
    pathParams: [{ name: 'doc_id', default: 'DOC-001' }],
    queryParams: [{ name: 'format', default: 'csv' }] },
  { id: 'doc-create', group: 'documentation', method: 'POST', path: '/documentation', auth: true,
    desc: 'Create a doc log entry (e.g. when patient instructions are saved).',
    body: {
      rxId: 'RX2024-001',
      instructions: 'Take 1 tablet daily with food.',
      language: 'en',
      method: 'PRINT',
      setting: 'Private'
    } },

  // instructions
  { id: 'instr-generate', group: 'instructions', method: 'POST', path: '/instructions/generate', auth: true,
    desc: 'Server-side render patient instructions text.',
    body: {
      rxId: 'RX2024-001',
      language: 'en',
      options: {}
    } },
  { id: 'instr-send', group: 'instructions', method: 'POST', path: '/instructions/send', auth: true,
    desc: 'Dispatch instructions (PRINT | DIGITAL | BOTH).',
    body: {
      patientId: 'PAT-001',
      rxId: 'RX2024-001',
      content: 'Take 1 tablet daily with food.',
      method: 'PRINT'
    } },

  // side-effects
  { id: 'se-list', group: 'side-effects', method: 'GET', path: '/side-effects', auth: true,
    desc: 'List ADR / pharmacovigilance reports.',
    queryParams: [
      { name: 'q',    default: '' },
      { name: 'sort', default: 'date' },
    ] },
  { id: 'se-flag', group: 'side-effects', method: 'POST', path: '/side-effects/{report_id}/flag', auth: true,
    desc: 'Advance the report status one step (PENDING_REVIEW → ESCALATED → EOF_REPORTED).',
    pathParams: [{ name: 'report_id', default: 'SE-001' }] },

  // patients
  { id: 'patient-get', group: 'patients', method: 'GET', path: '/patients/{patient_id}', auth: true,
    desc: 'Patient profile.',
    pathParams: [{ name: 'patient_id', default: 'PAT-001' }] },
  { id: 'patient-rx', group: 'patients', method: 'GET', path: '/patients/{patient_id}/prescriptions', auth: true,
    desc: 'Patient prescription history.',
    pathParams: [{ name: 'patient_id', default: 'PAT-001' }] },
  { id: 'patient-se', group: 'patients', method: 'GET', path: '/patients/{patient_id}/side-effects', auth: true,
    desc: 'Patient ADR history.',
    pathParams: [{ name: 'patient_id', default: 'PAT-001' }] },

  // notifications
  { id: 'notify-physician', group: 'notifications', method: 'POST', path: '/notifications/physician', auth: true,
    desc: 'Send physician notification.',
    body: { rxId: 'RX2024-001', message: 'Please confirm dosage on RX2024-001.' } },
];

const GROUP_ORDER = [
  'health', 'auth', 'pharmapi', 'prescriptions', 'safety-checks',
  'spc', 'alerts', 'messages', 'documentation', 'instructions',
  'side-effects', 'patients', 'notifications',
];

/* ============================================================
   State
   ============================================================ */
const STORE_KEY = 'pharmassist-dev-test:v1';
const state = {
  baseUrl: 'http://localhost:8000',
  token: '',
  selected: null,           // endpoint id
  formValues: {},           // per endpoint id { pathParams, queryParams, formFields, body }
  history: [],              // [{method, path, status, ts}]
  historyCollapsed: false,
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
  } catch (_) { /* ignore */ }
}
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      baseUrl: state.baseUrl,
      token: state.token,
      selected: state.selected,
      formValues: state.formValues,
      history: state.history.slice(0, 10),
      historyCollapsed: state.historyCollapsed,
    }));
  } catch (_) { /* ignore */ }
}

/* ============================================================
   Sidebar
   ============================================================ */
function renderSidebar(filter = '') {
  const list = document.getElementById('sidebar-list');
  const f = filter.toLowerCase().trim();
  const grouped = {};
  for (const ep of ENDPOINTS) {
    if (f && !(`${ep.method} ${ep.path} ${ep.desc}`.toLowerCase().includes(f))) continue;
    (grouped[ep.group] ||= []).push(ep);
  }

  let html = '';
  for (const g of GROUP_ORDER) {
    const items = grouped[g];
    if (!items || !items.length) continue;
    html += `<div class="group-title">${escapeHtml(g)}</div>`;
    for (const ep of items) {
      const active = ep.id === state.selected ? ' active' : '';
      html += `
        <div class="ep-item${active}" data-ep-id="${ep.id}">
          <span class="method-badge method-${ep.method}">${ep.method}</span>
          <span class="ep-path">${escapeHtml(ep.path)}</span>
        </div>`;
    }
  }
  list.innerHTML = html || `<div style="padding:18px;color:var(--muted-2);font-size:12px">No matches.</div>`;
  list.querySelectorAll('.ep-item').forEach(el => {
    el.addEventListener('click', () => selectEndpoint(el.dataset.epId));
  });
}

/* ============================================================
   Form rendering
   ============================================================ */
function getFormState(ep) {
  if (!state.formValues[ep.id]) {
    const fv = { pathParams: {}, queryParams: {}, formFields: {}, body: '' };
    (ep.pathParams  || []).forEach(p => fv.pathParams[p.name]  = p.default ?? '');
    (ep.queryParams || []).forEach(p => fv.queryParams[p.name] = p.default ?? '');
    (ep.formFields  || []).forEach(p => fv.formFields[p.name]  = p.default ?? '');
    if (ep.body) fv.body = JSON.stringify(ep.body, null, 2);
    state.formValues[ep.id] = fv;
  }
  return state.formValues[ep.id];
}

function selectEndpoint(id) {
  state.selected = id;
  saveState();
  renderSidebar(document.getElementById('ep-search').value);
  renderMain();
}

function renderMain() {
  const main = document.getElementById('main');
  const ep = ENDPOINTS.find(e => e.id === state.selected);
  if (!ep) {
    main.innerHTML = `<div class="main-empty">
      Pick an endpoint from the sidebar.<br>
      <span style="color:var(--muted-2);font-size:12px">
        Tip: hit <strong>Quick setup</strong> to log in &amp; open a Pharmapi session in one click.
      </span>
    </div>`;
    return;
  }
  const fv = getFormState(ep);
  const authTag = ep.auth
    ? `<span class="ep-auth-tag">auth required</span>`
    : `<span class="ep-auth-tag public">public</span>`;

  let html = `
    <div class="ep-header">
      <span class="method-badge method-${ep.method}">${ep.method}</span>
      <span class="path">${escapeHtml(ep.path)}</span>
      ${authTag}
    </div>
    <p class="ep-meta">${escapeHtml(ep.desc || '')}</p>

    <div class="form-card" id="form-card">`;

  // Path params
  if (ep.pathParams && ep.pathParams.length) {
    html += `<div class="field-section"><h4>Path parameters</h4>`;
    for (const p of ep.pathParams) {
      html += `
        <div class="field-row">
          <label>{${escapeHtml(p.name)}}</label>
          <input data-kind="path" data-name="${escapeHtml(p.name)}" type="text"
                 value="${escapeAttr(fv.pathParams[p.name] ?? '')}" spellcheck="false">
        </div>`;
    }
    html += `</div>`;
  }

  // Query params
  if (ep.queryParams && ep.queryParams.length) {
    html += `<div class="field-section"><h4>Query parameters</h4>`;
    for (const p of ep.queryParams) {
      html += `
        <div class="field-row">
          <label>${escapeHtml(p.name)}</label>
          <input data-kind="query" data-name="${escapeHtml(p.name)}" type="text"
                 value="${escapeAttr(fv.queryParams[p.name] ?? '')}" spellcheck="false"
                 placeholder="(optional)">
        </div>`;
    }
    html += `</div>`;
  }

  // Form fields (login)
  if (ep.formFields && ep.formFields.length) {
    html += `<div class="field-section"><h4>Form data <span class="field-hint">application/x-www-form-urlencoded</span></h4>`;
    for (const p of ep.formFields) {
      html += `
        <div class="field-row">
          <label>${escapeHtml(p.name)}</label>
          <input data-kind="form" data-name="${escapeHtml(p.name)}"
                 type="${escapeAttr(p.type || 'text')}"
                 value="${escapeAttr(fv.formFields[p.name] ?? '')}" spellcheck="false">
        </div>`;
    }
    html += `</div>`;
  }

  // Body
  if (ep.body) {
    html += `
      <div class="field-section">
        <h4>Body <span class="field-hint">application/json</span></h4>
        <textarea id="body-input" spellcheck="false">${escapeHtml(fv.body || '')}</textarea>
      </div>`;
  }

  html += `
      <div class="form-actions">
        <button class="btn primary" id="send-btn">Send ${ep.method}</button>
        <button class="btn ghost" id="reset-form-btn">Reset to defaults</button>
        <span style="flex:1"></span>
        <span style="color:var(--muted-2);font-size:11px;font-family:var(--mono)" id="resolved-url"></span>
      </div>
    </div>

    <div id="response-slot"></div>
  `;

  main.innerHTML = html;

  // Wire inputs
  main.querySelectorAll('input[data-kind], textarea').forEach(input => {
    input.addEventListener('input', () => {
      const fv = getFormState(ep);
      if (input.id === 'body-input') {
        fv.body = input.value;
      } else {
        const k = input.dataset.kind;
        const n = input.dataset.name;
        if (k === 'path')  fv.pathParams[n]  = input.value;
        if (k === 'query') fv.queryParams[n] = input.value;
        if (k === 'form')  fv.formFields[n]  = input.value;
      }
      saveState();
      updateResolvedUrl(ep);
    });
  });

  document.getElementById('send-btn').addEventListener('click', () => sendRequest(ep));
  document.getElementById('reset-form-btn').addEventListener('click', () => {
    delete state.formValues[ep.id];
    saveState();
    renderMain();
  });

  updateResolvedUrl(ep);
}

function updateResolvedUrl(ep) {
  const el = document.getElementById('resolved-url');
  if (!el) return;
  const { url } = buildUrl(ep);
  el.textContent = url;
}

/* ============================================================
   Request building & sending
   ============================================================ */
function buildUrl(ep) {
  const fv = getFormState(ep);
  let path = ep.path;
  for (const p of (ep.pathParams || [])) {
    const v = encodeURIComponent(fv.pathParams[p.name] ?? '');
    path = path.replace(`{${p.name}}`, v);
  }
  const qsParts = [];
  for (const p of (ep.queryParams || [])) {
    const v = fv.queryParams[p.name];
    if (v !== undefined && v !== null && String(v).trim() !== '') {
      qsParts.push(`${encodeURIComponent(p.name)}=${encodeURIComponent(v)}`);
    }
  }
  const qs = qsParts.length ? '?' + qsParts.join('&') : '';
  const base = (state.baseUrl || '').replace(/\/+$/, '');
  return { url: base + path + qs, path, qs };
}

async function sendRequest(ep) {
  const fv = getFormState(ep);
  const sendBtn = document.getElementById('send-btn');
  const slot = document.getElementById('response-slot');
  sendBtn.disabled = true;
  slot.innerHTML = `<div class="response"><div class="response-head">
    <span class="status-badge status-net">…</span>
    <span class="latency">sending…</span>
  </div></div>`;

  const { url } = buildUrl(ep);
  const headers = {};
  let body;

  if (ep.contentType === 'form') {
    headers['Content-Type'] = 'application/x-www-form-urlencoded';
    const params = new URLSearchParams();
    for (const p of (ep.formFields || [])) {
      params.append(p.name, fv.formFields[p.name] ?? '');
    }
    body = params.toString();
  } else if (ep.body) {
    headers['Content-Type'] = 'application/json';
    body = fv.body || '';
    // sanity-check JSON before sending; if user wrote junk show parse error inline
    try { JSON.parse(body); }
    catch (e) {
      sendBtn.disabled = false;
      renderResponse({ networkError: true, errorMessage: `Body is not valid JSON: ${e.message}`, latency: 0 });
      return;
    }
  }

  if (ep.auth && state.token) {
    headers['Authorization'] = `Bearer ${state.token}`;
  }

  const t0 = performance.now();
  let res, errMsg, payload, contentType;
  try {
    res = await fetch(url, {
      method: ep.method,
      headers,
      body: ['GET', 'HEAD'].includes(ep.method) ? undefined : body,
    });
    contentType = res.headers.get('content-type') || '';
    if (contentType.includes('application/json')) {
      payload = await res.json();
    } else {
      payload = await res.text();
    }
  } catch (e) {
    errMsg = e.message || String(e);
  }
  const latency = Math.round(performance.now() - t0);
  sendBtn.disabled = false;

  if (errMsg) {
    addHistory({ method: ep.method, path: ep.path, status: 0, latency, ts: Date.now() });
    renderResponse({ networkError: true, errorMessage: errMsg, latency });
    return;
  }

  // Side effects: capture token from /auth/login, refresh session dot from /pharmapi/*
  if (ep.id === 'auth-login' && res.ok && payload && payload.access_token) {
    state.token = payload.access_token;
    saveState();
    renderHeader();
    toast('Token saved.');
  }
  if (ep.id === 'pharmapi-status' && res.ok && payload) {
    setSessionDot(payload.pharmapi_connected, payload);
  }
  if (ep.id === 'pharmapi-connect' && res.ok && payload && payload.success) {
    setSessionDot(true);
  }

  addHistory({ method: ep.method, path: ep.path, status: res.status, latency, ts: Date.now() });
  renderResponse({
    status: res.status, statusText: res.statusText,
    payload, contentType, latency,
  });
}

/* ============================================================
   Response rendering
   ============================================================ */
function renderResponse(r) {
  const slot = document.getElementById('response-slot');
  if (r.networkError) {
    slot.innerHTML = `
      <div class="response">
        <div class="response-head">
          <span class="status-badge status-net">NET</span>
          <span class="latency">${r.latency} ms</span>
        </div>
        <div class="callout">
          <strong>Network error.</strong> ${escapeHtml(r.errorMessage)}<br>
          <span style="color:var(--muted)">
            Check that the backend is running at the Base URL above
            (default: <code>uvicorn backend.main:app --reload</code>).
          </span>
        </div>
      </div>`;
    return;
  }

  const cls = r.status >= 500 ? 'status-5xx'
            : r.status >= 400 ? 'status-4xx'
            : r.status >= 300 ? 'status-3xx'
            : 'status-2xx';

  let prettyHtml;
  if (typeof r.payload === 'string') {
    const isPdf = (r.contentType || '').includes('pdf');
    const truncated = r.payload.length > 12000 ? r.payload.slice(0, 12000) + '\n\n…[truncated]' : r.payload;
    prettyHtml = `<pre>${escapeHtml(isPdf
      ? `[binary ${r.contentType}; ${r.payload.length} bytes — open the URL in a browser to download]`
      : truncated)}</pre>`;
  } else {
    prettyHtml = `<pre>${highlightJson(r.payload)}</pre>`;
  }

  const callout = errorCallout(r);

  slot.innerHTML = `
    <div class="response">
      <div class="response-head">
        <span class="status-badge ${cls}">${r.status} ${escapeHtml(r.statusText || '')}</span>
        <span class="latency">${r.latency} ms</span>
        <span class="latency" style="color:var(--muted-2)">${escapeHtml(r.contentType || '')}</span>
        <div class="response-actions">
          <button class="btn ghost" id="copy-json-btn">Copy JSON</button>
        </div>
      </div>
      ${callout}
      <div class="response-body">${prettyHtml}</div>
    </div>`;

  document.getElementById('copy-json-btn').addEventListener('click', () => {
    const text = typeof r.payload === 'string' ? r.payload : JSON.stringify(r.payload, null, 2);
    navigator.clipboard.writeText(text).then(
      () => toast('Copied.'),
      () => toast('Copy failed — select &amp; copy manually.')
    );
  });
}

function errorCallout(r) {
  const text = JSON.stringify(r.payload || '');
  const detail = (r.payload && typeof r.payload === 'object' && r.payload.detail) ? String(r.payload.detail) : '';
  const codes = ['G11', 'G12', 'G14', 'G15'];
  const found = codes.find(c => text.includes(c) || detail.includes(c));

  // Heuristic match on Pharmapi error messages even without explicit code
  let inferred = null;
  if (!found && detail) {
    if (/no active connection/i.test(detail) || /never connected/i.test(detail))     inferred = 'G12';
    else if (/24h.*expired/i.test(detail) || /Connection time limit/i.test(detail)) inferred = 'G14';
    else if (/Api-Key missing/i.test(detail))                                       inferred = 'G15';
    else if (/Api-Key invalid/i.test(detail))                                       inferred = 'G11';
  }
  const code = found || inferred;
  if (!code) return '';

  const guidance = {
    G11: ['Pharmapi <strong>Api-Key invalid</strong>.', 'Check the <code>PHARMAPI_API_KEY</code> env var on the backend — value mismatch with what ΗΔΥΚΑ issued.'],
    G12: ['Pharmapi <strong>session not yet established</strong>.', 'Hit <code>POST /pharmapi/connect</code> first (or use <strong>Quick setup</strong>).'],
    G14: ['Pharmapi <strong>24h session expired</strong>.', 'Log into <code>https://test.e-prescription.gr/epregen2/</code> in your browser, then call <code>POST /pharmapi/connect</code> again.'],
    G15: ['Pharmapi <strong>Api-Key missing</strong>.', 'Set the <code>PHARMAPI_API_KEY</code> env var on the backend before starting uvicorn.'],
  }[code];

  return `<div class="callout"><strong>${code}</strong> · ${guidance[0]}<br>${guidance[1]}</div>`;
}

/* ============================================================
   Header bits
   ============================================================ */
function renderHeader() {
  const baseInput = document.getElementById('base-url');
  baseInput.value = state.baseUrl;
  const pill = document.getElementById('jwt-pill');
  if (state.token) {
    pill.textContent = `JWT: ${state.token.slice(0, 18)}…${state.token.slice(-6)}`;
    pill.classList.add('has-token');
  } else {
    pill.textContent = 'JWT: (none)';
    pill.classList.remove('has-token');
  }
}

function setSessionDot(connected, info) {
  const dot   = document.getElementById('session-dot-light');
  const label = document.getElementById('session-dot-label');
  dot.classList.remove('ok', 'warn', 'err');
  if (connected) {
    dot.classList.add('ok');
    const mins = info?.session_valid_for_minutes;
    label.textContent = mins != null ? `Pharmapi: connected (${Math.round(mins)} min left)` : 'Pharmapi: connected';
  } else {
    dot.classList.add('err');
    label.textContent = 'Pharmapi: not connected';
  }
}

/* ============================================================
   Quick setup: login + pharmapi/connect
   ============================================================ */
async function quickSetup() {
  const btn = document.getElementById('quick-setup');
  btn.disabled = true;
  const orig = btn.textContent;
  try {
    btn.textContent = 'Logging in…';
    const loginRes = await fetch(`${state.baseUrl.replace(/\/+$/, '')}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: 'pharmacist@demo.gr', password: 'demo123' }).toString(),
    });
    if (!loginRes.ok) throw new Error(`login failed (${loginRes.status})`);
    const loginJson = await loginRes.json();
    state.token = loginJson.access_token;
    saveState();
    renderHeader();

    btn.textContent = 'Connecting Pharmapi…';
    const connectRes = await fetch(`${state.baseUrl.replace(/\/+$/, '')}/pharmapi/connect`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${state.token}` },
    });
    let connectJson = null;
    try { connectJson = await connectRes.json(); } catch (_) {}
    setSessionDot(connectRes.ok && connectJson?.success, null);

    if (!connectRes.ok) {
      toast(`Logged in. Pharmapi connect failed: ${connectRes.status}`);
    } else {
      toast('Logged in &amp; Pharmapi session opened.');
    }
  } catch (e) {
    toast(`Quick setup failed: ${e.message}`);
    setSessionDot(false);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

/* ============================================================
   History
   ============================================================ */
function addHistory(rec) {
  state.history.unshift(rec);
  state.history = state.history.slice(0, 10);
  saveState();
  renderHistory();
}
function renderHistory() {
  const list = document.getElementById('history-list');
  document.getElementById('history-count').textContent = state.history.length;
  if (!state.history.length) {
    list.innerHTML = `<div style="padding:14px 18px;color:var(--muted-2);font-size:12px">No requests yet.</div>`;
    return;
  }
  list.innerHTML = state.history.map((h, i) => {
    const cls = h.status === 0 ? 'h-net'
              : h.status >= 500 ? 'h-5xx'
              : h.status >= 400 ? 'h-4xx'
              : h.status >= 300 ? 'h-3xx'
              : 'h-2xx';
    const t = new Date(h.ts);
    const hh = String(t.getHours()).padStart(2,'0');
    const mm = String(t.getMinutes()).padStart(2,'0');
    const ss = String(t.getSeconds()).padStart(2,'0');
    return `<div class="history-item" data-i="${i}">
      <span class="method-badge method-${h.method}">${h.method}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(h.path)}</span>
      <span class="h-status ${cls}">${h.status === 0 ? 'NET' : h.status}</span>
      <span class="h-time">${h.latency} ms</span>
      <span class="h-time">${hh}:${mm}:${ss}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const h = state.history[Number(el.dataset.i)];
      if (!h) return;
      const ep = ENDPOINTS.find(e => e.method === h.method && e.path === h.path);
      if (ep) selectEndpoint(ep.id);
    });
  });
}
function setHistoryCollapsed(c) {
  state.historyCollapsed = c;
  document.getElementById('history').classList.toggle('collapsed', c);
  saveState();
}

/* ============================================================
   Helpers
   ============================================================ */
function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

function highlightJson(value) {
  const s = JSON.stringify(value, null, 2);
  if (!s) return '';
  return escapeHtml(s)
    // strings (then keys re-styled)
    .replace(/"([^"\\]*(?:\\.[^"\\]*)*)"(\s*:)?/g, (_, body, colon) =>
      colon
        ? `<span class="j-key">"${body}"</span>${colon}`
        : `<span class="j-str">"${body}"</span>`)
    .replace(/\b(true|false)\b/g, '<span class="j-bool">$1</span>')
    .replace(/\bnull\b/g, '<span class="j-null">null</span>')
    .replace(/(?<![\w"])-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?(?![\w"])/g, '<span class="j-num">$&</span>');
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ============================================================
   Bootstrap
   ============================================================ */
function init() {
  loadState();
  renderHeader();
  renderSidebar();
  renderMain();
  renderHistory();
  setHistoryCollapsed(state.historyCollapsed);
  setSessionDot(false);

  document.getElementById('base-url').addEventListener('input', e => {
    state.baseUrl = e.target.value;
    saveState();
    if (state.selected) updateResolvedUrl(ENDPOINTS.find(x => x.id === state.selected));
  });
  document.getElementById('ep-search').addEventListener('input', e => renderSidebar(e.target.value));
  document.getElementById('quick-setup').addEventListener('click', quickSetup);
  document.getElementById('logout-btn').addEventListener('click', () => {
    state.token = '';
    saveState();
    renderHeader();
    setSessionDot(false);
    toast('Token cleared.');
  });
  document.getElementById('jwt-pill').addEventListener('click', () => {
    if (!state.token) return;
    navigator.clipboard.writeText(state.token).then(
      () => toast('JWT copied to clipboard.'),
      () => toast('Copy failed.')
    );
  });
  document.getElementById('history-toggle').addEventListener('click', () => {
    setHistoryCollapsed(!state.historyCollapsed);
  });

  // Probe Pharmapi status if we already have a token (returning visit)
  if (state.token) {
    fetch(`${state.baseUrl.replace(/\/+$/, '')}/pharmapi/status`, {
      headers: { 'Authorization': `Bearer ${state.token}` },
    }).then(r => r.ok ? r.json() : null)
      .then(j => { if (j) setSessionDot(j.pharmapi_connected, j); })
      .catch(() => {});
  }
}

init();
</script>
